services:
  - type: web
    name: skillmatch-app
    env: python
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn skillmatch.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: skillmatch-app.onrender.com
      - key: ADZUNA_API_ID
        sync: false
      - key: ADZUNA_API_KEY
        sync: false
      - key: GITHUB_API_TOKEN
        sync: false

